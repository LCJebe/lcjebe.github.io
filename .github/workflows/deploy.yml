name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual dispatch from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions for Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; do NOT cancel an in-progress run
# (so it can finish before queued runs start).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload site
        uses: withastro/action@v3
        # Defaults: path: '.', node-version: 20, package-manager: auto-detect

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
